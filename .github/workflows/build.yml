name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build BlockCraft.sln -c Release
      - run: dotnet test tests/BlockCraft.Core.Tests -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: BlockCraft.bundle
          path: src/BlockCraft.Civil3D/bin/Release/net8.0-windows/BlockCraft.bundle
