name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build CivDoom.sln -c Release
      - run: dotnet test tests/CivDoom.Engine.Tests -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: CivDoom.bundle
          path: bundle/CivDoom.bundle
