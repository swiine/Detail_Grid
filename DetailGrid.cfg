; DetailGrid configuration
; Edit the values after each "=" sign, then reload DetailGrid.lsp
; (or restart the DETAILGRID command) for changes to take effect.
;
; Lives in the _support\Detail_Grid folder, which DetailGrid.lsp checks
; directly (see *dg:support-dir* near the top of the .lsp) - no need to
; add this folder to the Support File Search Path just for this file.

; Name of the block to use as the grid.
GRID_BLOCK=detail_line

; Full path to the .dwg file that contains GRID_BLOCK. Used to
; auto-import the block into a drawing if it isn't already defined there.
GRID_SOURCE_DWG=A:\Civil\AutoCAD\Global\Australia\NSW\_default\Scripts\_under_development\_support\Detail_Grid\detail_grid.dwg

; Layer the grid block is inserted on (created automatically, non-plotting).
GRID_LAYER=DETAIL-GRID
